name: automatic-run-heatmap

on:
  schedule:
    - cron: "50 */4 * * *"

  workflow_dispatch:

permissions: 
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run_is_needed: ${{ steps.check.outputs.run_is_needed }}
    timeout-minutes: 350
    environment: production
    if: github.ref == 'refs/heads/feature/workflow'

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Perform check to see if a full run is needed
        id: check
        run: python -u -m main check
        env:
          API_KEY_CLAUDE: ${{ secrets.API_KEY_CLAUDE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY_OPEN_ROUTER: ${{ secrets.API_KEY_OPEN_ROUTER }}
          API_KEY_HUGGINGFACE: ${{ secrets.API_KEY_HUGGINGFACE }}

  mistral:
    needs: check
    if: github.ref == 'refs/heads/feature/workflow' && needs.check.outputs.run_is_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis for Mistral models
        run: python -u -m main run --model mistral --output state/state.pkl
        env:
          API_KEY_CLAUDE: ${{ secrets.API_KEY_CLAUDE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY_OPEN_ROUTER: ${{ secrets.API_KEY_OPEN_ROUTER }}
          API_KEY_HUGGINGFACE: ${{ secrets.API_KEY_HUGGINGFACE }}

      - name: Save results as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: state-1
          path: state/state.pkl
          if-no-files-found: error
          retention-days: 1
  
  claude:
    needs: mistral
    if: github.ref == 'refs/heads/feature/workflow' && needs.check.outputs.run_is_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download state from previous job
        uses: actions/download-artifact@v4
        with:
          name: state-1
          path: state

      - name: Run analysis for Claude models
        run: python -u -m main run --model claude --input state/state.pkl --output state/state.pkl
        env:
          API_KEY_CLAUDE: ${{ secrets.API_KEY_CLAUDE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY_OPEN_ROUTER: ${{ secrets.API_KEY_OPEN_ROUTER }}
          API_KEY_HUGGINGFACE: ${{ secrets.API_KEY_HUGGINGFACE }}

      - name: Save results as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: state-2
          path: state/state.pkl
          if-no-files-found: error
          retention-days: 1

  llama:
    needs: claude
    if: github.ref == 'refs/heads/feature/workflow' && needs.check.outputs.run_is_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download state from previous job
        uses: actions/download-artifact@v4
        with:
          name: state-2
          path: state

      - name: Run analysis for Llama models
        run: python -u -m main run --model llama --input state/state.pkl --output state/state.pkl
        env:
          API_KEY_CLAUDE: ${{ secrets.API_KEY_CLAUDE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY_OPEN_ROUTER: ${{ secrets.API_KEY_OPEN_ROUTER }}
          API_KEY_HUGGINGFACE: ${{ secrets.API_KEY_HUGGINGFACE }}

      - name: Save results as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: state-3
          path: state/state.pkl
          if-no-files-found: error
          retention-days: 1

  deepseek:
    needs: llama
    if: github.ref == 'refs/heads/feature/workflow' && needs.check.outputs.run_is_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download state from previous job
        uses: actions/download-artifact@v4
        with:
          name: state-3
          path: state

      - name: Run analysis for Deepseek models
        run: python -u -m main run --model deepseek --input state/state.pkl --output state/state.pkl
        env:
          API_KEY_CLAUDE: ${{ secrets.API_KEY_CLAUDE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY_OPEN_ROUTER: ${{ secrets.API_KEY_OPEN_ROUTER }}
          API_KEY_HUGGINGFACE: ${{ secrets.API_KEY_HUGGINGFACE }}

      - name: Save results as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: state-4
          path: state/state.pkl
          if-no-files-found: error
          retention-days: 1

  gemini:
    needs: deepseek
    if: github.ref == 'refs/heads/feature/workflow' && needs.check.outputs.run_is_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download state from previous job
        uses: actions/download-artifact@v4
        with:
          name: state-4
          path: state

      - name: Run analysis for Gemini models
        run: python -u -m main run --model gemini --input state/state.pkl --output state/state.pkl
        env:
          API_KEY_CLAUDE: ${{ secrets.API_KEY_CLAUDE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY_OPEN_ROUTER: ${{ secrets.API_KEY_OPEN_ROUTER }}
          API_KEY_HUGGINGFACE: ${{ secrets.API_KEY_HUGGINGFACE }}

      - name: Save results as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: state-5
          path: state/state.pkl
          if-no-files-found: error
          retention-days: 1

  gpt:
    needs: gemini
    if: github.ref == 'refs/heads/feature/workflow' && needs.check.outputs.run_is_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download state from previous job
        uses: actions/download-artifact@v4
        with:
          name: state-5
          path: state

      - name: Run analysis for GPT models
        run: python -u -m main run --model gpt --input state/state.pkl --output state/state.pkl
        env:
          API_KEY_CLAUDE: ${{ secrets.API_KEY_CLAUDE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY_OPEN_ROUTER: ${{ secrets.API_KEY_OPEN_ROUTER }}
          API_KEY_HUGGINGFACE: ${{ secrets.API_KEY_HUGGINGFACE }}

      - name: Save results as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: state-6
          path: state/state.pkl
          if-no-files-found: error
          retention-days: 1

  upload_to_huggingface:
    needs: gpt
    if: github.ref == 'refs/heads/feature/workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download state from previous run
        uses: actions/download-artifact@v4
        with:
          name: state-6
          path: incoming

      - name: Upload heatmap to Hugging Face
        run: python -u -m main run --final --input incoming/state.pkl
        env:
          API_KEY_CLAUDE: ${{ secrets.API_KEY_CLAUDE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY_OPEN_ROUTER: ${{ secrets.API_KEY_OPEN_ROUTER }}
          API_KEY_HUGGINGFACE: ${{ secrets.API_KEY_HUGGINGFACE }}

      - name: Save visuals as run artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figure
          path: output/
          if-no-files-found: ignore
          retention-days: 3
  